[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vitpoultry"
version = "1.0.0"
description = "Federated Finetuning of a Vision Transformer on Poultry Health"
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.26.1",
    "flwr-datasets[vision]>=0.6.0",
    "torch==2.8.0",
    "torchvision==0.23.0",
    "scikit-learn>=1.4.0",
    "grad-cam>=1.5.0",
    "timm>=0.9.0",
    "imagehash>=4.3.0",
    "Pillow>=10.0.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "huggingface_hub>=0.20.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "dianyo"

[tool.flwr.app.components]
serverapp = "vitpoultry.server_app:app"
clientapp = "vitpoultry.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 10
batch-size = 32
learning-rate = 0.001
dataset-name = "Dianyo/poultry-fecal-fl"
num-classes = 4
model-name = "vit_b_16"
strategy = "fedavg"
proximal-mu = 0.1
partitioning = "iid"
dirichlet-alpha = 0.5

